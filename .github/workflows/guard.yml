name: repo-guard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate public content and change history
        env:
          GUARD_DENYLIST: ${{ secrets.GUARD_DENYLIST }}
          REQUIRE_PRIVATE_GUARD: 'true'
          GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/repo-guard.sh
      - name: Exercise guard regressions
        run: python3 scripts/test-repo-guard.py
